<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения, мама!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeIn 0.5s forwards;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        p {
            font-size: 16px;
            color: #666;
        }
        .photo {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .photo:hover {
            transform: scale(1.05);
        }
        img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>С Днем Рождения, Мама!</h1>
        <p>Ты — самый лучший человек в моей жизни!</p>
        <div class="photo">
            <img src="images/photo1.jpg" alt="Фото 1">
        </div>
        <div class="photo">
            <img src="images/photo2.jpg" alt="Фото 2">
        </div>
        <div class="photo">
            <img src="images/photo3.jpg" alt="Фото 3">
        </div>
        <div class="photo">
            <img src="images/photo4.jpg" alt="Фото 4">
        </div>
        <p>Желаю тебе счастья, здоровья и любви!</p>
    </div>
</body>
</html>
